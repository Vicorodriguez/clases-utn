<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <div class="container">
        <h1>Mi lista de tareas</h1>

        <input type="text"
        id="taskInput"
        placeholder="Escribe una nueva tarea..."
        maxlength="50"
        required
        aria-label="Nueva tarea"
        aria-describedby="task-help"
        >
        
        <small id="task-help" class="help-text"> Presiona Enter o haz clic 
            en agregar tarea</small>

        <button id="addTaskBtn" aria-label="Agragar nueva tarea">Agregar tarea</button>
  
     <ul id="taskList"></ul>
  
    </div>
    <script></script>
</body>
</html>
